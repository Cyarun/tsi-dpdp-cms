<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <!--
    This performs a client-side redirect from /console/index.html to the webapp-root
    index.html (the operator login), one level above /console/.
    It is more reliable than web.xml forwarding in environments without JSP.

    vAIb-zv2g fix: the console is served under a base path (e.g. /vaib/cms), NOT the
    domain root. A root-absolute '/index.html' resolved to the wrong host (the docs
    domain root, not the CMS webapp). Derive the base from the URL (everything before
    '/console/') so the redirect lands on THIS webapp's own index.html.
    -->
    <script type="text/javascript">
(function () {
    var p = window.location.pathname || '';
    var i = p.indexOf('/console/');
    var target = (i > 0 ? p.slice(0, i) : '') + '/index.html';
    window.location.href = target;
})();
</script>
</head>
<body>
<p>Redirecting to <a href="../index.html">main login</a>...</p>
</body>
</html>
