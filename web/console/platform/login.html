<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Platform Console - Operator Login</title>
    <!--
      vAIb-2yn0 — DEDICATED PLATFORM login page (OUTSIDE Wix).

      This is the login surface for the THREE TSI platform-scope operators
      (SUPER_ADMIN / ONBOARDING_MANAGER / SUPPORT_ASSISTANT). It reuses the EXACT
      existing password-login path (Operator.handleLogin, _func="login" against
      /api/v1/admin/operator) — NO new auth code, NO new secret. The server returns
      role + fiduciary_id; a PLATFORM operator carries the all-zeros (NULL) fiduciary.

      PLATFORM-ONLY GATE (client-side UX guard, NOT the security boundary): if the
      login succeeds but the operator is a TENANT operator (concrete fiduciary), we
      REFUSE to seed a platform session and tell them to use their Wix dashboard. The
      AUTHORITATIVE block lives server-side (InputProcessor platform role matrix +
      the fabric cross-surface block); this guard just avoids seeding a confusing
      session in the browser. The discriminator is fiduciary NULL-vs-concrete.

      The PAGE is public (served by fabric); the POST is gated by the operator
      password (password_hash / checkPassword). Same posture as the /index.html login.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- vAIb-7b9f: shared console design system (tokens + components). The login page
         keeps a small page-local block below for its centered-card layout + the button
         shine animation (genuinely login-specific, not design-system components). -->
    <link rel="stylesheet" href="../console.css">
    <style>
        /* Login is a standalone centered card — override the shared sidebar layout
           (no sidebar here) so the card sits dead-center. */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-left: 0;
        }

        /* The primary CTA is the brand RED (dpdpa.support buttons rule); hover red-600. */
        .animated-button {
            position: relative;
            overflow: hidden;
            z-index: 0;
            background-color: var(--primary);
            color: var(--primary-foreground);
            transition: background-color 0.3s ease;
        }
        .animated-button:hover { background-color: var(--red-600); }

        .animated-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg,
                    rgba(255, 255, 255, 0.2) 0%,
                    rgba(255, 255, 255, 0.6) 50%,
                    rgba(255, 255, 255, 0.2) 100%);
            transform: skewX(-20deg);
            z-index: 1;
        }

        .animated-button:hover::before {
            animation: shine 1.2s ease-in-out forwards;
        }

        @keyframes shine {
            0% { left: -75%; }
            100% { left: 125%; }
        }

        .input-style {
            height: 40px;
            border-color: var(--border);
        }

        .login-card {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .platform-text {
            color: var(--secondary);
        }
    </style>
</head>

<body>
<div class="w-full max-w-lg p-8 bg-[var(--card)] rounded-[var(--radius)] border border-[var(--border)] login-card">

    <!-- Header / Logo Area — DPDPA.support brand lockup (vAIb-xhke). -->
    <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-3 mb-3">
            <img src="../brand/logo.svg" alt="DPDPA" width="44" height="44" style="border-radius:11px">
            <div class="text-left leading-tight">
                <span class="block text-xl font-black platform-text tracking-tight">DPDPA.center</span>
                <span class="block text-[10px] text-[var(--muted-foreground)] font-bold uppercase tracking-[0.2em]">TSI Platform Console</span>
            </div>
        </div>
        <p class="text-[10px] text-[var(--muted-foreground)] mt-1 font-bold uppercase tracking-[0.2em]">Operator Console &middot; Cross-Tenant</p>
        <h1 class="text-lg font-bold mt-4 text-[var(--foreground)]">Platform Operator Login</h1>
        <p class="text-[11px] text-[var(--muted-foreground)] mt-2">For TSI platform staff only. Tenant owners &amp; DPOs use their Wix dashboard.</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handlePlatformLogin(event)">
        <div class="space-y-5">
            <div>
                <label for="email" class="block text-[10px] font-black text-[var(--muted-foreground)] uppercase tracking-widest mb-1">Email (Login ID)</label>
                <input type="email" id="email" name="email" required
                       class="input-style w-full px-3 py-2 border border-[var(--border)] rounded-[var(--radius)] focus:ring-2 focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none transition-all text-sm"
                       placeholder="operator@thesilentintelligence.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-[10px] font-black text-[var(--muted-foreground)] uppercase tracking-widest">Password</label>
                    <!-- vAIb-83bu: recovery flow (reset_password_via_recovery — no auth needed). -->
                    <a href="#" onclick="openRecovery();return false;" class="text-[10px] font-bold text-[var(--tsi-accent,var(--ring))] hover:underline">Forgot Password?</a>
                </div>
                <input type="password" id="password" name="password" required
                       class="input-style w-full px-3 py-2 border border-[var(--border)] rounded-[var(--radius)] focus:ring-2 focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none transition-all text-sm"
                       placeholder="••••••••••••">
            </div>

            <button type="submit"
                    class="animated-button w-full h-11 inline-flex items-center justify-center rounded-md font-bold text-sm uppercase tracking-widest shadow-lg hover:bg-opacity-90 transition-all">
                Secure Platform Login
            </button>
        </div>
    </form>

    <!-- Message/Error Area -->
    <div id="login-message" class="mt-6 text-center text-xs font-bold hidden"></div>

</div>

<!-- vAIb-83bu: password recovery (reset_password_via_recovery). email + recovery phrase +
     new password. reset_password_via_recovery is an ADMIN_NOAUTH func, so this works from the
     login page with no session. The recovery phrase is issued from the CMS Users page. -->
<div id="recovery-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--card,#fff);padding:28px;border-radius:12px;max-width:420px;width:92%;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)">
    <h2 class="text-base font-bold text-[var(--foreground)] mb-1">Reset Password</h2>
    <p class="text-xs text-[var(--muted-foreground)] mb-4">Enter your email, your recovery phrase, and a new password (minimum 12 characters).</p>
    <form onsubmit="submitRecovery(event)">
      <label class="block text-[10px] font-black uppercase text-[var(--muted-foreground)] mb-1" for="rc-email">Email</label>
      <input type="email" id="rc-email" required class="w-full border border-[var(--border)] rounded-md px-3 py-2 mb-3 text-sm">
      <label class="block text-[10px] font-black uppercase text-[var(--muted-foreground)] mb-1" for="rc-phrase">Recovery phrase</label>
      <input type="text" id="rc-phrase" required autocomplete="off" class="w-full border border-[var(--border)] rounded-md px-3 py-2 mb-3 text-sm">
      <label class="block text-[10px] font-black uppercase text-[var(--muted-foreground)] mb-1" for="rc-new">New password</label>
      <input type="password" id="rc-new" required minlength="12" autocomplete="new-password" class="w-full border border-[var(--border)] rounded-md px-3 py-2 mb-2 text-sm">
      <p id="rc-message" class="text-xs hidden mb-2"></p>
      <div class="flex justify-end gap-3 mt-2">
        <button type="button" onclick="closeRecovery()" class="px-4 py-2 rounded-md text-sm font-bold text-[var(--muted-foreground)] hover:bg-[var(--muted)]">Cancel</button>
        <button type="submit" id="rc-submit" class="animated-button px-4 py-2 rounded-md text-sm font-bold">Reset Password</button>
      </div>
    </form>
  </div>
</div>

<script>
/**
 * vAIb-2yn0 — platform operator login. Reuses Operator.handleLogin (_func="login")
 * verbatim; the ONLY addition is the platform-scope check after a successful login.
 */
const PLATFORM_NULL_FID = '00000000-0000-0000-0000-000000000000';

async function handlePlatformLogin(event) {
    // The page is served under /console/platform/login.html, so the CMS API is two
    // vAIb-2yn0: the platform login POST must hit fabric's UNGATED /cms/platform-login
    // (TSI staff have no Wix instance; the owner-gated /cms/api/* would 401 before the
    // CMS). Derive the console base from THIS page's path (we are at <base>/platform/
    // login.html) so it resolves under the public /vaib/fabric/console/cms prefix.
    const _P = location.pathname;
    const _BASE = _P.slice(0, _P.indexOf('/platform/'));   // .../console/cms
    const API_LOGIN_URL = _BASE + '/platform-login';
    // The platform console is the cross-tenant admin dashboard (a NULL-fiduciary
    // operator drives get_admin_metrics / list_fiduciaries cross-tenant). Another
    // agent owns the console page's name/branding; we only point at it.
    const PLATFORM_CONSOLE_URL = (function(){var P=location.pathname;return P.slice(0,P.indexOf('/platform/'))+'/platform/dashboard.html';})();

    event.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageArea = document.getElementById('login-message');

    messageArea.textContent = '';
    messageArea.classList.add('hidden');
    messageArea.classList.remove('text-red-500', 'text-green-600', 'text-blue-500');

    if (password.length < 12) {
        messageArea.textContent = "Error: Password must be at least 12 characters long.";
        messageArea.classList.remove('hidden');
        messageArea.classList.add('text-red-500');
        return;
    }

    messageArea.textContent = "Verifying platform credentials...";
    messageArea.classList.remove('hidden');
    messageArea.classList.add('text-blue-500');

    try {
        const payload = { _func: "login", identifier: email, password: password };

        const response = await fetch(API_LOGIN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const responseData = await response.json();

        if (response.ok && responseData.success === true) {
            // PLATFORM-SCOPE GUARD (UX): a platform operator carries the NULL (all-zeros)
            // fiduciary. A TENANT operator (concrete fiduciary — e.g. a Wix owner ADMIN or
            // a tenant DPO) is NOT a platform user; refuse to seed a platform session and
            // send them to Wix. (Server-side authz is the real boundary; this is a guard.)
            const fid = responseData.fiduciary_id || '';
            if (fid !== PLATFORM_NULL_FID) {
                messageArea.textContent = "This is the TSI platform console. Tenant owners and DPOs sign in from their Wix dashboard.";
                messageArea.classList.replace('text-blue-500', 'text-red-500');
                return;
            }

            // Seed the platform session (NULL fiduciary). Same keys the console pages read.
            localStorage.setItem('authToken', responseData.token);
            localStorage.setItem('username', responseData.username);
            localStorage.setItem('role', responseData.role);
            localStorage.setItem('fiduciary_id', responseData.fiduciary_id); // NULL/all-zeros
            localStorage.setItem('fiduciary_name', responseData.fiduciary_name || 'TSI Platform');
            // vAIb-83bu: this is a DIRECT (standalone) login — NOT the Wix-embedded panel.
            // Clear any stale Wix-embedded marker a prior Wix session may have left on this
            // browser, so the console shows the full account menu (logout/change password).
            // Only the server-side /cms/launch landing (owner-gated) ever SETS this marker.
            localStorage.removeItem('wix_embedded');

            messageArea.textContent = "Login successful. Loading platform console...";
            messageArea.classList.replace('text-blue-500', 'text-green-600');

            setTimeout(() => { window.location.href = PLATFORM_CONSOLE_URL; }, 800);
        } else {
            const errorText = responseData.message || "Invalid credentials. Please verify your login ID and password.";
            messageArea.textContent = errorText;
            messageArea.classList.replace('text-blue-500', 'text-red-500');
        }
    } catch (error) {
        messageArea.textContent = 'Network Error: Cannot reach the platform service.';
        messageArea.classList.replace('text-blue-500', 'text-red-500');
        console.error('Connection error:', error);
    }
}

// vAIb-83bu — password recovery (reset_password_via_recovery). Posts to the UNGATED fabric
// /recovery route (sibling of /platform-login); reset_password_via_recovery is an ADMIN_NOAUTH
// func so it needs no operator JWT. The recovery phrase is the auth. Never logs it.
function _recoveryUrl() {
    const P = location.pathname;
    const BASE = P.slice(0, P.indexOf('/platform/'));   // .../console/cms
    return BASE + '/recovery';                           // ungated fabric -> CMS /admin/operator
}
function openRecovery() {
    const m = document.getElementById('rc-message');
    m.classList.add('hidden'); m.textContent = '';
    document.getElementById('rc-email').value = document.getElementById('email').value || '';
    document.getElementById('rc-phrase').value = '';
    document.getElementById('rc-new').value = '';
    document.getElementById('recovery-overlay').style.display = 'flex';
}
function closeRecovery() { document.getElementById('recovery-overlay').style.display = 'none'; }
async function submitRecovery(event) {
    event.preventDefault();
    const email = document.getElementById('rc-email').value.trim();
    const phrase = document.getElementById('rc-phrase').value.trim();
    const pw = document.getElementById('rc-new').value;
    const m = document.getElementById('rc-message');
    const btn = document.getElementById('rc-submit');
    const show = (t, ok) => { m.textContent = t; m.classList.remove('hidden','text-red-500','text-green-600'); m.classList.add(ok ? 'text-green-600' : 'text-red-500'); };
    if (pw.length < 12) { show('New password must be at least 12 characters.', false); return; }
    btn.disabled = true; btn.textContent = 'Resetting…';
    try {
        const response = await fetch(_recoveryUrl(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ _func: 'reset_password_via_recovery', email: email, passphrase: phrase, new_password: pw })
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok && data && data.success) {
            show('Password reset. You can now log in with your new password.', true);
            setTimeout(closeRecovery, 1500);
        } else {
            show((data && data.message) || 'Reset failed. Check your email and recovery phrase.', false);
        }
    } catch (e) {
        show('Network error. Please try again.', false);
    } finally {
        btn.disabled = false; btn.textContent = 'Reset Password';
    }
}
</script>
</body>
</html>
