<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPDPA.center - Initial System Setup</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../env.js"></script>
    <style>
        /* DPDPA.support FIXED BRAND (vAIb-xhke) — staff setup page; fixed brand.
           W2 re-skin (w2-lane-c): page-local hex literals removed — canonical tokens
           injected by console.py (tweakcn-theme.css alias layer). Per ADOPTION.md §5.
           Dark-mode reconcile: no .dark selector or prefers-color-scheme existed here;
           the "incidental dark" (ADOPTION.md §3) was the blue focus rings + palette
           utilities fighting the token layer. Neutralised below — fixed-LIGHT output. */

        body {
            background-color: var(--background);
            font-family: var(--font-sans);
            color: var(--foreground);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1, h2, h3, h4 { color: var(--secondary); }
        /* Primary CTA = brand RED; .primary-bg is the red action surface here. */
        .primary-bg { background-color: var(--primary); }
        .primary-text { color: var(--secondary); }
        .hover\:bg-primary-dark:hover { background-color: var(--red-600); }

        .card-login {
            background-color: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 90%;
            max-width: 450px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="card-login">
    <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-3">
            <img src="../brand/logo.svg" alt="DPDPA" width="36" height="36" style="border-radius:9px">
            <span class="text-lg font-bold primary-text">DPDPA.center</span>
        </div>
        <h1 class="text-2xl font-bold primary-text">Super Admin Setup</h1>
    </div>

    <p id="setup-message" class="text-sm font-medium hidden" role="alert"></p>

    <form id="setup-form" class="space-y-4">

        <!-- Email -->
        <div>
            <label for="email" class="block text-sm font-medium text-[var(--foreground)]">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="admin@example.com"
                   class="mt-1 block w-full p-2 border border-[var(--border)] rounded-[var(--radius)] shadow-sm focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none">
        </div>

        <!-- Full Name -->
        <div>
            <label for="name" class="block text-sm font-medium text-[var(--foreground)]">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="System Administrator"
                   class="mt-1 block w-full p-2 border border-[var(--border)] rounded-[var(--radius)] shadow-sm focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none">
        </div>

        <!-- Password -->
        <div>
            <label for="password" class="block text-sm font-medium text-[var(--foreground)]">Password</label>
            <input type="password" id="password" name="password" required minlength="12" placeholder="Minimum 12 Characters"
                   class="mt-1 block w-full p-2 border border-[var(--border)] rounded-[var(--radius)] shadow-sm focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none">
            <p class="mt-1 text-xs text-[var(--muted-foreground)]">
                Use a unique, strong password (min 12 characters).
            </p>
        </div>

        <!-- Password Confirmation -->
        <div>
            <label for="password-confirm" class="block text-sm font-medium text-[var(--foreground)]">Confirm Password</label>
            <input type="password" id="password-confirm" name="password_confirm" required minlength="12" placeholder="Repeat Password"
                   class="mt-1 block w-full p-2 border border-[var(--border)] rounded-[var(--radius)] shadow-sm focus:ring-[var(--ring)] focus:border-[var(--ring)] outline-none">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="setup-btn"
                class="w-full primary-bg text-white px-4 py-2 mt-4 rounded-md font-semibold hover:bg-primary-dark transition duration-150">
            Finalize Setup & Create Admin
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="../index.html" class="text-sm primary-text hover:underline" id="login-link" style="display:none;">
            Go to Login Page
        </a>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            // vAIb-zv2g fix: this page is also served directly by the CMS under a mount
            // prefix (e.g. /vaib/cms/console/setup/init.html) with NO server-side rewrite
            // in that path — a root-absolute '/api/...' resolves to the wrong host there.
            // Derive the base from the URL (everything before '/console/') so the API path
            // is correct wherever the console is mounted.
            const CONSOLE_BASE = (function () {
                const p = window.location.pathname || '';
                const i = p.indexOf('/console/');
                return i > 0 ? p.slice(0, i) : '';
            })();
            const API_SETUP_URL = CONSOLE_BASE + '/api/v1/bootstrap/setup';
            const LOGIN_PAGE_URL = '../index.html';

            const form = document.getElementById('setup-form');
            const messageArea = document.getElementById('setup-message');
            const loginLink = document.getElementById('login-link');
            const setupBtn = document.getElementById('setup-btn');

            const emailInput = document.getElementById('email');
            const nameInput = document.getElementById('name');
            const passwordInput = document.getElementById('password');
            const passwordConfirmInput = document.getElementById('password-confirm');

            function displayMessage(text, isError) {
                messageArea.textContent = text;
                messageArea.classList.remove('hidden', 'text-red-500', 'text-green-500');
                messageArea.classList.add(isError ? 'text-red-500' : 'text-green-500');
            }

            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                // Reset state
                messageArea.classList.add('hidden');
                setupBtn.disabled = true;
                setupBtn.textContent = 'Processing Setup...';
                loginLink.style.display = 'none';

                const email = emailInput.value.trim();
                const name = nameInput.value.trim();
                const password = passwordInput.value;
                const passwordConfirm = passwordConfirmInput.value;

                // Client-side Validation Checks
                if (password.length < 12) {
                    displayMessage("Error: Password must be at least 12 characters long.", true);
                    setupBtn.disabled = false;
                    setupBtn.textContent = 'Finalize Setup & Create Admin';
                    return;
                }
                if (password !== passwordConfirm) {
                    displayMessage("Error: Passwords do not match.", true);
                    setupBtn.disabled = false;
                    setupBtn.textContent = 'Finalize Setup & Create Admin';
                    return;
                }

                try {
                    // 1. Prepare Payload
                    const payload = {
                        "_func": "initial_setup",
                        "email": email,
                        "name": name,
                        "password": password
                    };

                    // 2. Perform API Setup Call
                    const response = await fetch(API_SETUP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // We must always read the response body to handle API-level errors
                    const responseData = await response.json();

                    if (response.ok && responseData.success === true) {
                        // --- SUCCESS ---
                        displayMessage("Setup complete! Super Administrator account created successfully.", false);
                        setupBtn.textContent = 'Setup Complete';
                        setupBtn.disabled = false;
                        form.style.display = 'none';
                        // Show login link after successful setup
                        loginLink.style.display = 'block';

                    } else {
                        // --- FAILURE ---
                        let errorText = "Setup failed. This usually means the system is already configured.";
                        if (responseData.error && responseData.error.message) {
                            errorText = responseData.error.message;
                        } else if (response.status !== 200) {
                            errorText = `Setup failed (Status: ${response.status}). The server likely rejected the request.`;
                        }

                        displayMessage(errorText, true);
                        setupBtn.textContent = 'Setup Failed - Retry';
                    }

                } catch (error) {
                    // Handle network error
                    displayMessage('Cannot connect to the setup server. Check if the backend is running.', true);
                    setupBtn.textContent = 'Connection Error - Retry';
                } finally {
                    setupBtn.disabled = false;
                }
            });
        });
    </script>

</body>

</html>
